var I={chev:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>',srt:ic('<path d="M7 4v16M7 20l-3-3M7 20l3-3"/><path d="M17 20V4M17 4l-3 3M17 4l3 3"/>',20),tally:ic('<circle cx="12" cy="12" r="8.5"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/>',20),filt:ic('<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>',20),sort:ic('<path d="M5 8h14M5 12h14M5 16h14"/>'),check:ic('<path d="M5 12l5 5 9-10"/>'),plus:ic('<path d="M12 5v14M5 12h14"/>'),pencil:ic('<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>'),trash:ic('<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/>'),refresh:ic('<path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/>',20),x:ic('<path d="M6 6l12 12M18 6L6 18"/>',18),link:ic('<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>')};
var NOTES=[
 {v:'1.8.0',d:'2026-11-10',n:['Names and title: change the two names and the title in Controls, under Names and title. Saved on this phone. Defaults are Person 1, Person 2 and Home Budget.','Hosting moved to GitHub Pages. The security policy is now set inside the page.']},
 {v:'1.7.2',d:'2026-11-10',n:['Saving to the sheet: bulk changes (mark, unmark, delete many entries) are sent slowly enough to stay under the sheet’s limit on writes per minute. If the limit is still reached, the app waits for it to reset and tries again, instead of stopping with a quota error. A big bulk change takes a few minutes to reach the sheet.']},
 {v:'1.7.1',d:'2026-11-03',n:['Name and vendor autofill: values the app filled in are replaced when you change the transaction name or the vendor. Values you chose yourself are kept. If the name or vendor no longer matches an entry, the filled values are cleared. Whichever of name or vendor you typed last takes priority.']},
 {v:'1.7.0',d:'2026-11-03',n:['Vendor autofill: when you type a vendor you have used before, the empty fields (category, sub-category, mode, medium and type) fill in from its most recent entry. A line under the vendor says where they came from. Fields you have chosen are kept, and a matching transaction name still takes priority.']},
 {v:'1.6.6',d:'2026-10-31',n:['Select mode: the selected total, the delete confirmation and the Actions sheet now show two decimal places, like the amounts in the list.']},
 {v:'1.6.5',d:'2026-10-30',n:['Amount filter: back to the old behaviour. Income and refunds are included again when you set a Min or Max.']},
 {v:'1.6.4',d:'2026-10-27',n:['Names and title (added in 1.6.3) is removed. The title and names are as before.','A calendar day with only refunds no longer shows a negative total.']},
 {v:'1.6.2',d:'2026-10-27',n:['Entry screen: Delete now gives the Undo window, like the swipe and confirm delete.','Month arrows stop at the first and last linked year instead of jumping to the wrong month.','Retyping a name in the form fills only the fields that are still empty, so your chosen category stays.','Paste skips rows that are already in the app and says how many were skipped.','Unlinking a year is refused while it has changes waiting to sync.','Bars and percentages in Reports stay between 0 and 100% when refunds exceed spending.','Payment modes and sub-categories with the same name are not added twice.','Messages no longer hide each other early.','The sync status counts a delete that is still waiting for Undo.','A new entry is dated to the first of the month you are viewing when that month is in the past.','CSV export protects text that starts with =, +, - or @; import restores it.','New installs start with no daily spending limit until you set one.','The unexpected-error box clears itself after 10 seconds.','Removing the PIN asks for the PIN first.','Budgets for categories you have removed are hidden. Their saved amounts are kept.','Amount filter: income is left out unless Income is chosen, and refunds unless Refunds is chosen.','Person filter: a Not set choice shows entries without a person.']},
 {v:'1.6.1',d:'2026-10-15',n:['Faster opening: the app shows at once from the copy saved on the phone and checks for updates in the background. The title font no longer holds up the first screen.']},
 {v:'1.6.0',d:'2026-10-15',n:['Filters: Has comment, which shows only entries with a comment, and Medium, with Online and Offline buttons.','Undo: after deleting an entry, Undo is available for six seconds before the delete is sent to the sheet.']},
 {v:'1.5.3',d:'2026-10-15',n:['Day view: the first entry now shows its date, like the others.']},
 {v:'1.5.2',d:'2026-10-15',n:['Amount filter: if Min is above Max, they swap when the Filters sheet closes.','Back to latest is a round arrow button on the left, next to the + button, shown only when you have scrolled away from the latest entries.']},
 {v:'1.5.1',d:'2026-10-14',n:['PIN keypad: slightly bigger round keys (81 points on tall phones, with larger digits), scaled to fit shorter screens, and a tap between two keys now counts for the nearest key instead of doing nothing.']},
 {v:'1.5.0',d:'2026-10-13',n:['Refunds: a new refund button beside the title of the Add and Edit form. Turn it on, type a normal amount, and it is saved as money back, taken off its category. Refunds now show in green with a refund icon, and the Status filter has a Refunds choice.','Sort: a new icon in the Transactions search box. Sort by date (newest or oldest first) or by amount (highest or lowest first). By amount the list is plain, with the date on each row.','Select mode: the list keeps the normal order, and the selection is no longer remembered. When something is selected, a toolbar replaces the tab bar with Mark, Delete and the total, following the view you are in (selected, or not selected).']},
 {v:'1.4.6',d:'2026-10-13',n:['Select mode: a new icon in the Transactions search box. Tap entries to select them. All selects or deselects everything shown, the tick and circle icons show only the selected or not selected entries, and the arrow icon clears the selection.','The three dots icon opens an Actions sheet with the selected and not selected totals, and Mark or Delete for either group. Delete always asks first.','Filters: Status now also has Not marked and No comment.','Home: tap the Monthly budget or Yearly pots row in the open Budgets panel to jump to that section.']},
 {v:'1.4.5',d:'2026-10-12',n:['Budgets: under the totals panel, the monthly categories sit in their own rounded block, and Yearly pots has its own separate block, each with a quiet heading.','Home: opening the totals panel scrolls it to the top of the screen so you can see it is open; closing it scrolls back to the top of Home.','Transactions: touch the right edge of a month list and drag to jump to a day, with a bubble showing the date.','Transactions: a Back to latest button appears once you have scrolled far down.']},
 {v:'1.4.4',d:'2026-10-12',n:['Duplicate, Edit and quick-add now open the form without the keyboard; tap Amount to bring it up. A new entry from the + button still starts in Amount.','You can close the keyboard by tapping empty space in the form or pressing Enter, which now shows as Done on the keyboard.']},
 {v:'1.4.3',d:'2026-10-12',n:['Budgets: the occasional group is now called Yearly pots, so it cannot be read as a full-year budget. The panel shows Monthly budget and Yearly pots, the list has matching headings, and the editor dropdown says Monthly or Yearly pot.','The editor boxes read Monthly budget and Yearly pots, with a hint that pots are for occasional things like vacation, medical or insurance.','Controls, Budgets reads, for example, Monthly ₹1,27,500 · Yearly pots ₹3,50,000.']},
 {v:'1.4.2',d:'2026-10-12',n:['Budgets: the yearly budget total now sits in the panel next to the monthly one, with its own bar and the year tick. Under the panel, the list has simple headings for the monthly and yearly categories.','Controls, Budgets now shows the totals, for example ₹1,27,500 a month · ₹3,50,000 a year.','When you create or change budgets, live monthly and yearly totals stay at the top of the editor and update as you type.']},
 {v:'1.4.1',d:'2026-10-12',n:['The Budgets panel stays compact until you tap it: it shows the total spent, the split bar and the Monthly / Yearly line. The monthly budget with its bar, and the category list, open together when you tap.']},
 {v:'1.4.0',d:'2026-10-12',n:['Budgets now have a period. In Controls, Budgets, choose per month or per year for each category. Everyday categories stay monthly; occasional ones like vacation, medical or insurance can be yearly.','Home: the Budgets panel shows the total spent for the month, split into monthly and yearly, with your monthly budget under it. Tap Yearly to see those transactions. Open the list to see a Yearly budgets group with the year so far for each one.','The transaction details sheet is cleaner: category chip, lighter paise, the full date, small pills, and Revisit, Duplicate and Delete as small buttons.','Expenses no longer show a minus sign. Income shows a green plus.','Reports: the Monthly/Yearly tab is gone. Tap the month or year and choose Whole year.','Bigger numbers on the PIN keypad.','If the sheet formatting step fails when a row is saved, the app now remembers and retries it on the next sync.']},
 {v:'1.3.3',d:'2026-10-10',n:['Under the Budgets panel, a Not budgeted line shows spending in categories that have no budget, with a line showing total spent = in budget + not budgeted. Tap it to see those transactions.','The Home calendar always shows six rows, so the Budgets card below it no longer moves when you change months.']},
 {v:'1.3.2',d:'2026-10-10',n:['Budgets: a bar now turns orange when you are spending faster than the month is passing. The allowed lead is 30% of the budget on day 1 and shrinks to 5% by the last day. Red and the 80% orange work as before.','The date picker stays the same size from month to month, so the arrows no longer move.','Swipe left or right in the date picker to change the month.']},
 {v:'1.3.1',d:'2026-10-10',n:['Fixed the date picker flickering when you change months.','Tap the month in the date picker to jump to another month or year.']},
 {v:'1.3.0',d:'2026-10-10',n:['A filter button in the search box on Transactions and next to the eye in Reports. Filter by person, time period (with custom dates), payment mode, category, type, amount and status. You can pick more than one payment mode, category or type.','Transactions can show a whole year or all time, 150 entries at a time.','Search now also looks at payment mode, type, amount and date, and every word you type must match.','Budgets on Home: tap the top panel to open the full list. Bars are green, orange or red, with a tick for today.','The blue and pink dots moved into the filter sheet.','New app logo, also shown at the top of the PIN screen.','Fixed the Google sign-in window asking for permission to open after you enter your PIN.','The app now saves its data in a much smaller form, so it keeps working with 20,000 or more entries.','If a filter hides an entry you just added or edited, the app tells you.']},
 {v:'1.2.2',d:'2026-10-10',n:['PIN screen: the title and dots now sit close above the keypad.','Pinching no longer zooms the app.','Took out the Month | Year switch on Transactions. It was added to 1.2.1 by mistake and is not finished.']},
 {v:'1.2.1',d:'2026-10-10',n:['Fixed a duplicate entry that could appear when you left the app right after saving.','Fixed a red patch showing behind a transaction when you tap it or scroll.','The PIN keypad counts a digit the moment you touch it, and sits near the bottom of the screen.','The app no longer gets stuck on syncing when the connection hangs.','Fixed a delete that could get stuck, an edit that could be lost, and a delete that could come back while syncing.','New Month | Year switch on Transactions. The year view shows 150 entries at a time and searches the whole year.']},
 {v:'1.2.0',d:'2026-10-09',n:['Blue and pink person colors: a thin stripe on each new entry shows who added it.','Two small dots in Reports and Transactions show one person\'s entries. Tap the same dot again to see everyone.','The report card says "Spent by" a person while a dot is selected.','Choose your color once, in Sign-in account (My color).','Reorder entries within a day by dragging the handle. The arrows are gone.','The PIN keypad makes you wait after 10 wrong tries.','Fixed opening the app with no internet. The offline file was empty in 1.1.0.','Extra safety rules on the web page, so the app can only talk to Google.']},
 {v:'1.1.0',d:'2026-10-08',n:['Reorder entries within a day: drag the handle or tap the arrows.','Tap Income, Spent or Savings in Reports to see what is behind them.','New PIN keypad, and the app stays unlocked for 1 minute when you switch to another app.','Sign-in account setting for phones with more than one Google account.','Version number and these release notes.','An error message on screen if something breaks.','Icons instead of words on the small buttons.']},
 {v:'1.0.1',d:'Oct 2026',n:['Fixed Controls not opening.','Google sign-in now starts from your PIN or your first tap.','Quieter sync messages and a simpler last-synced line.','Renamed Years and sheets to Link sheets.']},
 {v:'1.0.0',d:'Oct 2026',n:['First release on your real sheets.','Entries, lists, budgets and settings sync with Google Sheets, and the app works offline.','PIN lock, hide numbers, calendar home screen, swipe to delete, pull down to sync.','Reports by category, type and mode, with PDF and CSV export.']}];

document.addEventListener('touchend',function(){if(!pon)return;pon=false;var p=$('ptr');p.style.opacity=0;p.style.transform='translate(-50%,0)';if(pdy>80&&window.scrollY<=0){SW=Date.now();if(typeof pullSync==='function')pullSync();else toast('Pull to sync works in the installed app')}});
var G={x:0,y:0,k:''};
document.addEventListener('touchstart',function(ev){var t=ev.target;G.k='';if(!t.closest||t.closest('.ov,#lock,.sw,.ordr,input,textarea,select,nav,.fab'))return;
  G.k=t.closest('.dsw')?'dim':((S.tab==='home'||S.tab==='tx'||S.tab==='reports')?'mon':'');G.x=ev.touches[0].clientX;G.y=ev.touches[0].clientY},{passive:true});
document.addEventListener('touchend',function(ev){if(!G.k)return;var k=G.k;G.k='';var t=ev.changedTouches[0],dx=t.clientX-G.x,dy=t.clientY-G.y;
  if(Math.abs(dx)<55||Math.abs(dx)<Math.abs(dy)*1.6)return;var d=dx<0?1:-1;SW=Date.now();
  if(k==='dim'){var o=['c','y','m'],i=o.indexOf(S.dim)+d;if(i<0||i>2)return;S.dim=o[i];render();return}
  if((S.tab==='reports'&&S.rep==='y')||S.all){var j=YEARS.indexOf(Y)+d;if(j>=0&&j<YEARS.length){Y=YEARS[j];render()}}else{mv(d);render()}});
render();

addEventListener('input',function(ev){var t=ev.target;if(!t||t.id!=='f_n'||S.edit||!$('f_c'))return;
  var fl=$('f_fill');if(fl)fl.textContent='';
  var vv=t.value.trim().toLowerCase();if(!vv)return;
  var nm=($('f_t')?$('f_t').value:'').trim().toLowerCase();
  if(nm&&DATA.some(function(x){return(x.t||'').trim().toLowerCase()===nm}))return;
  var cands=DATA.filter(function(x){return(x.v||'').trim().toLowerCase()===vv});
  if(!cands.length)return;
  var m2=cands.reduce(function(a,b){return(b.d>a.d||(b.d===a.d&&b.id>a.id))?b:a});
  var got=[];var fcE=!$('f_c').value;
  if(fcE&&m2.c){$('f_c').value=m2.c;fillSub();if(m2.s)$('f_s').value=m2.s;got.push('category')}
  if(!$('f_m').value&&m2.mode){$('f_m').value=m2.mode;got.push('mode')}
  if(!$('f_e').value&&m2.med){$('f_e').value=m2.med;got.push('medium')}
  if(!$('f_y').value&&m2.type){$('f_y').value=m2.type;got.push('type')}
  if(fl&&got.length)fl.textContent='Filled from your last '+t.value.trim()+' entry ('+(typeof dsh==='function'?dsh(m2.d):m2.d)+'). Change any field if it is different.';
});

var AUTO_IDS=['f_c','f_s','f_m','f_e','f_y','f_n'];
function autoClear(){AUTO_IDS.forEach(function(id){var el=$(id);if(el&&el.dataset.auto&&!el.dataset.manual){el.value='';delete el.dataset.auto;if(id==='f_c')fillSub()}})}
function applyAuto(m,src){
  var ok=function(id){var el=$(id);return el&&!el.dataset.manual};
  var c=$('f_c');
  if(ok('f_c')&&m.c){var prevS=$('f_s').value;c.value=m.c;c.dataset.auto=src;fillSub();var sEl=$('f_s');
    if(sEl.dataset.manual){if([].some.call(sEl.options,function(o){return o.value===prevS}))sEl.value=prevS}
    else if(m.s){sEl.value=m.s;sEl.dataset.auto=src}}
  if(src==='name'&&ok('f_n')&&m.v){$('f_n').value=m.v;$('f_n').dataset.auto=src}
  if(ok('f_m')&&m.mode){$('f_m').value=m.mode;$('f_m').dataset.auto=src}
  if(ok('f_e')&&m.med){$('f_e').value=m.med;$('f_e').dataset.auto=src}
  if(ok('f_y')&&m.type){$('f_y').value=m.type;$('f_y').dataset.auto=src}
}
addEventListener('input',function(ev){var t=ev.target;if(!t||S.edit||!$('f_c'))return;
  if(t.id!=='f_t'&&t.id!=='f_n')return;
  if(t.id==='f_n')$('f_n').dataset.manual='1';
  window.__lastTyped=t.id;
  var nm=$('f_t').value.trim().toLowerCase(),vv=($('f_n').dataset.manual?$('f_n').value.trim().toLowerCase():'');
  var nameM=nm?DATA.slice().reverse().filter(function(x){return(x.t||'').trim().toLowerCase()===nm})[0]:null;
  var venM=null;
  if(vv){var cs=DATA.filter(function(x){return(x.v||'').trim().toLowerCase()===vv});if(cs.length)venM=cs.reduce(function(a,b){return(b.d>a.d||(b.d===a.d&&b.id>a.id))?b:a})}
  autoClear();
  var fl=$('f_fill');if(fl)fl.textContent='';
  if(venM&&(window.__lastTyped==='f_n'||!nameM)){applyAuto(venM,'vendor');if(fl)fl.textContent='Filled from your last '+$('f_n').value.trim()+' entry ('+(typeof dsh==='function'?dsh(venM.d):venM.d)+'). Change any field if it is different.'}
  else if(nameM){applyAuto(nameM,'name')}
});
addEventListener('change',function(ev){var t=ev.target;if(t&&!S.edit&&['f_c','f_s','f_m','f_e','f_y'].indexOf(t.id)>-1){t.dataset.manual='1';delete t.dataset.auto}});
</script>
